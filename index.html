<!DOCTYPE html>
<html lang="mk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Yane's Aggregator</title>

    <meta
        name="description"
        content="Yane's Aggregator - MKD, DE и YouTube вести"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f3f5;

            color: #222;

            line-height: 1.5;
        }


        /* ================================
           HEADER
        ================================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;

            padding: 25px 20px;

            text-align: center;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.15);
        }

        header h1 {

            font-size: 32px;

            letter-spacing: 1px;
        }

        header p {

            margin-top: 5px;

            color: #cbd5e1;

            font-size: 14px;
        }


        /* ================================
           MAIN
        ================================= */

        main {

            width: 95%;

            max-width: 1400px;

            margin: 25px auto;
        }


        /* ================================
           BANNERS
        ================================= */

        .banners {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .banner {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 85px;

            padding: 15px;

            background: white;

            border-radius: 12px;

            text-decoration: none;

            color: #111;

            font-weight: bold;

            border:
                1px solid #ddd;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .banner:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 6px 18px
                rgba(0, 0, 0, 0.12);
        }


        /* ================================
           SECTIONS
        ================================= */

        .section {

            margin-bottom: 45px;
        }

        .section-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;

            padding-bottom: 10px;

            border-bottom:
                3px solid #222;
        }

        .section-title h2 {

            font-size: 25px;
        }


        /* ================================
           NEWS GRID
        ================================= */

        .news-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;
        }


        /* ================================
           CARD
        ================================= */

        .card {

            background: white;

            border-radius: 12px;

            overflow: hidden;

            border:
                1px solid #ddd;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.06);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.12);
        }

        .card a {

            text-decoration: none;

            color: inherit;
        }


        /* ================================
           IMAGE
        ================================= */

        .card-image {

            width: 100%;

            height: 180px;

            object-fit: cover;

            display: block;

            background: #e5e7eb;
        }

        .no-image {

            height: 180px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e5e7eb;

            color: #6b7280;

            font-size: 40px;
        }


        /* ================================
           CARD CONTENT
        ================================= */

        .card-content {

            padding: 15px;
        }

        .card-title {

            font-size: 17px;

            font-weight: bold;

            line-height: 1.4;

            margin-bottom: 10px;
        }

        .card-source {

            font-size: 13px;

            color: #6b7280;
        }


        /* ================================
           YOUTUBE
        ================================= */

        .youtube .card {

            border-top:
                4px solid #ff0000;
        }


        /* ================================
           LOADING
        ================================= */

        .loading {

            text-align: center;

            padding: 30px;

            color: #777;
        }

        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 20px;

            border-radius: 10px;

            text-align: center;
        }


        /* ================================
           FOOTER
        ================================= */

        footer {

            text-align: center;

            padding: 30px 20px;

            margin-top: 30px;

            background: #111827;

            color: #9ca3af;

            font-size: 13px;
        }


        /* ================================
           TABLET
        ================================= */

        @media (max-width: 1000px) {

            .banners {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            header h1 {

                font-size: 25px;
            }

            .banners {

                grid-template-columns:
                    1fr;
            }

            .news-grid {

                grid-template-columns:
                    1fr;
            }

            .card-image,
            .no-image {

                height: 200px;
            }

        }

    </style>

</head>


<body>


<!-- ======================================
     HEADER
======================================= -->

<header>

    <h1>Yane's Aggregator</h1>

    <p>
        MKD • DE • YouTube
    </p>

</header>


<main>


    <!-- ==================================
         BANNERS
    =================================== -->

    <div class="banners">


        <!-- OpenZip -->

        <a
            class="banner"
            href="https://bloxgamesev7-prog.github.io/openzip/"
            target="_blank"
            rel="noopener"
        >
            OpenZip
        </a>


        <!-- Tendzi -->

        <a
            class="banner"
            href="https://tendzi.blogspot.com/?m=1"
            target="_blank"
            rel="noopener"
        >
            Tendzi Blog
        </a>


        <!-- ForFun81 -->

        <a
            class="banner"
            href="https://forfun81.github.io/#top"
            target="_blank"
            rel="noopener"
        >
            ForFun81
        </a>


        <!-- Techy -->

        <a
            class="banner"
            href="https://techy.techygithub.workers.dev/"
            target="_blank"
            rel="noopener"
        >
            Techy
        </a>


    </div>



    <!-- ==================================
         MKD
    =================================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                🇲🇰 MKD
            </h2>

        </div>


        <div
            id="mkd"
            class="news-grid"
        >

            <div class="loading">

                Се вчитуваат вести...

            </div>

        </div>

    </section>



    <!-- ==================================
         DE
    =================================== -->

    <section class="section">

        <div class="section-title">

            <h2>
                🇩🇪 DE
            </h2>

        </div>


        <div
            id="de"
            class="news-grid"
        >

            <div class="loading">

                Се вчитуваат вести...

            </div>

        </div>

    </section>



    <!-- ==================================
         YOUTUBE
    =================================== -->

    <section
        class="section youtube"
    >

        <div class="section-title">

            <h2>
                🎥 YouTube
            </h2>

        </div>


        <div
            id="youtube"
            class="news-grid"
        >

            <div class="loading">

                Се вчитуваат видеа...

            </div>

        </div>

    </section>


</main>



<!-- ======================================
     FOOTER
======================================= -->

<footer>

    © 2026 Yane's Aggregator

</footer>



<script>


    // ==================================
    // CREATE CARD
    // ==================================

    function createCard(item) {

        const card =
            document.createElement("article");


        card.className =
            "card";


        const link =
            document.createElement("a");


        link.href =
            item.url;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        // IMAGE

        if (item.image) {

            const image =
                document.createElement("img");


            image.className =
                "card-image";


            image.src =
                item.image;


            image.alt =
                item.title;


            image.loading =
                "lazy";


            image.onerror =
                function() {

                    this.outerHTML =
                        '<div class="no-image">📰</div>';

                };


            link.appendChild(
                image
            );

        } else {

            const noImage =
                document.createElement("div");


            noImage.className =
                "no-image";


            noImage.textContent =
                "📰";


            link.appendChild(
                noImage
            );

        }


        // CONTENT

        const content =
            document.createElement("div");


        content.className =
            "card-content";


        // TITLE

        const title =
            document.createElement("div");


        title.className =
            "card-title";


        title.textContent =
            item.title;


        // SOURCE

        const source =
            document.createElement("div");


        source.className =
            "card-source";


        source.textContent =
            item.source;


        content.appendChild(
            title
        );


        content.appendChild(
            source
        );


        link.appendChild(
            content
        );


        card.appendChild(
            link
        );


        return card;

    }



    // ==================================
    // LOAD SECTION
    // ==================================

    function loadSection(
        elementId,
        items
    ) {

        const container =
            document.getElementById(
                elementId
            );


        container.innerHTML =
            "";


        if (
            !items ||
            items.length === 0
        ) {

            container.innerHTML =
                '<div class="loading">Нема достапни вести.</div>';

            return;

        }


        items.forEach(
            function(item) {

                const card =
                    createCard(item);


                container.appendChild(
                    card
                );

            }
        );

    }



    // ==================================
    // LOAD NEWS.JSON
    // ==================================

    async function loadNews() {

        try {

            const response =
                await fetch(
                    "news.json?t=" +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "news.json не е достапен"
                );

            }


            const data =
                await response.json();


            loadSection(
                "mkd",
                data.mkd
            );


            loadSection(
                "de",
                data.de
            );


            loadSection(
                "youtube",
                data.youtube
            );


        }

        catch (error) {

            console.error(
                error
            );


            document.getElementById(
                "mkd"
            ).innerHTML =
                '<div class="error">Не може да се вчитаат вестите.</div>';


            document.getElementById(
                "de"
            ).innerHTML =
                '<div class="error">Не може да се вчитаат вестите.</div>';


            document.getElementById(
                "youtube"
            ).innerHTML =
                '<div class="error">Не може да се вчитаат видеата.</div>';

        }

    }



    // ==================================
    // START
    // ==================================

    loadNews();


</script>


</body>

</html>
