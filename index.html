        }

            text-decoration: none;

           IMAGE
        ========================== */

            width: 100%;

        ========================== */

<script>


/* =====================================================
   RSS SOURCES
===================================================== */

const feeds = {


    /* =========================

    ========================== */

    mkd: [

        {
            name:
                "SmartPortal",

            url:
                "https://smartportal.mk/feed/"
        },

        {

            url:
                "https://time.mk/rss/all"
        }

    ],


    /* =========================
       DE
    ========================== */

    de: [

        {
            name:
                "Centron",

            url:
                "https://www.centron.de/feed/"
        },

        {
            name:
                "Tarnkappe",

            url:
                "https://tarnkappe.info/feed"
        }

    ],


    /* =========================
       STAR WARS
    ========================== */

    starwars: [

        {
            name:
                "Star Wars News Net",

            url:
                "https://www.starwarsnewsnet.com/feed"
        },

        {
            name:
                "Star Wars Union",

            url:
                "https://starwars-union.de/feed/"
        },

        {
            name:
                "Jedi News",

            url:
                "https://www.jedinews.com/feed/"
        }

    ]

};


/* =====================================================
   WIKIMEDIA COMMONS FALLBACK IMAGES
===================================================== */

const DEFAULT_IMAGES = {


    /* 🇲🇰 FLAG OF NORTH MACEDONIA */

    mkd:
        "https://upload.wikimedia.org/wikipedia/commons/7/79/Flag_of_North_Macedonia.svg",


    /* 🇩🇪 FLAG OF GERMANY */

    de:
        "https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg",


    /* ⭐ STAR WARS */

    starwars:
        "https://upload.wikimedia.org/wikipedia/commons/6/6c/Star_Wars_Logo.svg"

};


/* =====================================================
   RSS2JSON API
===================================================== */

const RSS_API =
    "https://api.rss2json.com/v1/api.json?rss_url=";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    if (!text) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   EXTRACT IMAGE FROM HTML
===================================================== */

function extractImageFromHTML(
    html
) {

    if (!html) {

        return "";

    }


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    const img =
        doc.querySelector(
            "img"
        );


    if (!img) {

        return "";

    }


    return (

        img.getAttribute(
            "src"
        ) ||

        img.getAttribute(
            "data-src"
        ) ||

        img.getAttribute(
            "data-lazy-src"
        ) ||

        img.getAttribute(
            "data-original"
        ) ||

        ""

    );

}


/* =====================================================
   FIND IMAGE
===================================================== */

function getImage(item) {


    /* thumbnail */

    if (

        item.thumbnail &&

        typeof item.thumbnail ===
        "string"

    ) {

        return item.thumbnail;

    }


    /* enclosure */

    if (
        item.enclosure
    ) {


        if (
            item.enclosure.link
        ) {

            return item.enclosure.link;

        }


        if (
            Array.isArray(
                item.enclosure
            )
        ) {


            for (
                const enclosure
                of item.enclosure
            ) {


                if (
                    enclosure &&
                    enclosure.link
                ) {

                    return enclosure.link;

                }

            }

        }

    }


    /* media */

    if (
        item.media
    ) {


        const mediaValues = [

            item.media.content,

            item.media.thumbnail

        ];


        for (
            const value
            of mediaValues
        ) {


            if (
                Array.isArray(
                    value
                )
            ) {


                for (
                    const media
                    of value
                ) {


                    if (
                        media &&
                        media.url
                    ) {

                        return media.url;

                    }

                }

            }


            if (
                value &&
                value.url
            ) {

                return value.url;

            }

        }

    }


    /* description */

    const descriptionImage =

        extractImageFromHTML(

            item.description

        );


    if (
        descriptionImage
    ) {

        return descriptionImage;

    }


    /* content */

    const contentImage =

        extractImageFromHTML(

            item.content

        );


    if (
        contentImage
    ) {

        return contentImage;

    }


    return "";

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(

    item,

    sourceName,

    sectionType

) {


    const title =

        escapeHTML(

            item.title ||
            "Без наслов"

        );


    const link =

        item.link ||
        "#";


    const image =

        getImage(
            item
        );


    const fallbackImage =

        DEFAULT_IMAGES[
            sectionType
        ];


    const date =

        formatDate(
            item.pubDate
        );


    let imageHTML;


    /* =========================
       RSS IMAGE
    ========================== */

    if (
        image
    ) {


        imageHTML = `

            <div class="image-wrapper">

                <img

                    class="card-image"

                    src="${escapeHTML(image)}"

                    alt="${title}"

                    loading="lazy"

                    referrerpolicy="no-referrer"

                    onerror="
                        this.onerror=null;
                        this.src='${fallbackImage}';
                    "

                >

            </div>

        `;

    }


    /* =========================
       DEFAULT IMAGE
    ========================== */

    else {


        imageHTML = `

            <div class="image-wrapper">

                <img

                    class="fallback-image"

                    src="${fallbackImage}"

                    alt="${sectionType}"

                    loading="lazy"

                >

            </div>

        `;

    }


    return `

        <article class="card">

            <a

                href="${escapeHTML(link)}"

                target="_blank"

                rel="noopener noreferrer"

            >

                ${imageHTML}


                <div
                    class="card-content"
                >

                    <div
                        class="card-title"
                    >

                        ${title}

                    </div>


                    <div
                        class="card-source"
                    >

                        ${escapeHTML(
                            sourceName
                        )}

                    </div>


                    ${
                        date

                        ?

                        `

                        <div
                            class="card-date"
                        >

                            ${date}

                        </div>

                        `

                        :

                        ""

                    }

                </div>

            </a>

        </article>

    `;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    value
) {


    if (!value) {

        return "";

    }


    const date =

        new Date(
            value
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(

        "de-DE",

        {

            dateStyle:
                "short",

            timeStyle:
                "short"

        }

    );

}


/* =====================================================
   LOAD ONE RSS
===================================================== */

async function loadFeed(
    feed
) {


    const apiUrl =

        RSS_API +

        encodeURIComponent(
            feed.url
        );


    const response =

        await fetch(
            apiUrl
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =

        await response.json();


    if (
        data.status !== "ok"
    ) {

        throw new Error(

            data.message ||
            "RSS error"

        );

    }


    return data.items || [];

}


/* =====================================================
   LOAD SECTION
===================================================== */

async function loadSection(

    elementId,

    feedList,

    sectionType

) {


    const container =

        document.getElementById(
            elementId
        );


    container.innerHTML = `

        <div class="loading">

            Се вчитуваат вести...

        </div>

    `;


    const results =

        await Promise.allSettled(

            feedList.map(

                feed =>

                    loadFeed(
                        feed
                    )

                    .then(

                        items => ({

                            feed,

                            items

                        })

                    )

            )

        );


    let allItems = [];


    for (
        const result
        of results
    ) {


        if (
            result.status !==
            "fulfilled"
        ) {

            console.error(
                result.reason
            );

            continue;

        }


        const {

            feed,

            items

        } = result.value;


        items.forEach(

            item => {

                allItems.push({

                    ...item,

                    sourceName:
                        feed.name

                });

            }

        );

    }


    /* =========================
       NEWEST FIRST
    ========================== */

    allItems.sort(

        (a, b) => {

            const dateA =

                new Date(
                    a.pubDate || 0
                ).getTime();


            const dateB =

                new Date(
                    b.pubDate || 0
                ).getTime();


            return dateB - dateA;

        }

    );


    /* =========================
       MAX 30 ARTICLES
    ========================== */

    allItems =

        allItems.slice(
            0,
            30
        );


    /* =========================
       EMPTY
    ========================== */

    if (
        allItems.length === 0
    ) {


        container.innerHTML = `

            <div class="error">

                Нема достапни вести.

            </div>

        `;


        return;

    }


    /* =========================
       DISPLAY
    ========================== */

    container.innerHTML =

        allItems

            .map(

                item =>

                    createCard(

                        item,

                        item.sourceName,

                        sectionType

                    )

            )

            .join("");

}


/* =====================================================
   START AGGREGATOR
===================================================== */

loadSection(

    "mkd",

    feeds.mkd,

    "mkd"

);


loadSection(

    "de",

    feeds.de,

    "de"

);


loadSection(

    "starwars",

    feeds.starwars,

    "starwars"

);

</script>
