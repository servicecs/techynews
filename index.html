        * {

        header {

        /* =========================
           SECTION NAVIGATION
        ========================== */

        .section-nav {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            padding: 15px 15px;

            background: #e5e7eb;

            top: 0;

            z-index: 100;
        }


        .section-nav a {

            color: #222;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;

            padding:

            border-radius: 20px;

            border:

            transition:

        }

            background: #111827;

            color: white;

            box-shadow:

        /* =========================
           MAIN
        ========================== */

        main {

            width: 94%;

            max-width: 1400px;

            margin: 25px auto;
        }


        /* =========================
           BANNERS
        ========================== */

        .banners {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 12px;

            max-width: 1000px;

            margin:
                0 auto 40px auto;
        }


        .banner {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 62px;

            padding:
                12px 15px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 10px;

            text-decoration: none;

            color: #111;

            font-size: 15px;

            font-weight: bold;

            transition:
                all 0.2s ease;
        }


        .banner:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 6px 16px
                rgba(0,0,0,0.12);
        }


        /* =========================
           SECTIONS
        ========================== */

        .section {

            margin-bottom: 50px;

            scroll-margin-top: 80px;
        }


        .section-title {

            display: flex;

            align-items: center;

            border-bottom:
                3px solid #222;

            padding-bottom: 9px;

            margin-bottom: 20px;
        }


        .section-title h2 {

            font-size: 25px;
        }


        /* =========================
           NEWS GRID
        ========================== */

        .news-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;
        }


        /* =========================
           CARD
        ========================== */

        .card {

            background: white;

            border:
                1px solid #ddd;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.06);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.13);
        }


        .card a {

            display: block;

            text-decoration: none;

            color: inherit;
        }


        /* =========================
           IMAGE
        ========================== */

        .card-image {

            width: 100%;

            height: 190px;

            object-fit: cover;

            display: block;

            background: #e5e7eb;
        }


        .no-image {

            width: 100%;

            height: 190px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e5e7eb;

            font-size: 42px;
        }


        /* =========================
           CARD CONTENT
        ========================== */

        .card-content {

            padding: 15px;
        }


        .card-title {

            font-size: 17px;

            font-weight: bold;

            line-height: 1.4;

            margin-bottom: 9px;
        }


        .card-source {

            font-size: 13px;

            color: #6b7280;

            margin-bottom: 4px;
        }


        .card-date {

            font-size: 12px;

            color: #9ca3af;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 35px;

            color: #777;
        }


        /* =========================
           ERROR
        ========================== */

        .error {

            grid-column:
                1 / -1;

            padding: 20px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 10px;

            text-align: center;
        }


        /* =========================
           FOOTER
        ========================== */

            margin-top: 40px;

            padding: 30px 20px;

            text-align: center;

            background: #111827;

            color: #9ca3af;

            font-size: 13px;
        }

        ========================== */

            .banners {

           MOBILE

                gap: 7px;

            .section-nav a {

            }


            .news-grid {

                    1fr;
            }


            .card-image,

<script>


/* =====================================================
   RSS FEEDS
===================================================== */

const feeds = {


    /* =========================
       MKD
    ========================== */

    mkd: [

        {
            name: "SmartPortal",
            url:
                "https://smartportal.mk/feed/"
        },

        {
            name: "TIME.mk",
            url:
                "https://time.mk/rss/all"
        }

    ],


    /* =========================
       DE
    ========================== */

    de: [

        {
            name: "centron",
            url:
                "https://www.centron.de/feed/"
        },

        {
            name: "Tarnkappe",
            url:
                "https://tarnkappe.info/feed"
        }

    ],


    /* =========================
       STAR WARS
    ========================== */

    starwars: [

        {
            name:
                "Star Wars News Net",

            url:
                "https://www.starwarsnewsnet.com/feed"
        },

        {
            name:
                "Star Wars Union",

            url:
                "https://starwars-union.de/feed/"
        },

        {
            name:
                "Jedi News",

            url:
                "https://www.jedinews.com/feed/"
        }

    ]

};


/* =====================================================
   RSS2JSON
===================================================== */

const RSS_API =
    "https://api.rss2json.com/v1/api.json?rss_url=";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    if (!text) {

        return "";
    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FIND IMAGE
===================================================== */

function getImage(item) {


    /* 1. thumbnail */

    if (
        item.thumbnail &&
        item.thumbnail.trim()
    ) {

        return item.thumbnail;
    }


    /* 2. enclosure */

    if (
        item.enclosure &&
        item.enclosure.link
    ) {

        const type =
            item.enclosure.type ||
            "";


        if (
            type.startsWith(
                "image/"
            )
        ) {

            return item.enclosure.link;

        }

    }


    /* 3. media content */

    if (
        item.media &&
        item.media.content
    ) {

        const media =
            Array.isArray(
                item.media.content
            )

            ?

            item.media.content[0]

            :

            item.media.content;


        if (
            media &&
            media.url
        ) {

            return media.url;

        }

    }


    /* 4. media thumbnail */

    if (
        item.media &&
        item.media.thumbnail
    ) {

        const thumbnail =
            Array.isArray(
                item.media.thumbnail
            )

            ?

            item.media.thumbnail[0]

            :

            item.media.thumbnail;


        if (
            thumbnail &&
            thumbnail.url
        ) {

            return thumbnail.url;

        }

    }


    /* 5. description image */

    if (
        item.description
    ) {

        const match =
            item.description.match(
                /<img[^>]+(?:src|data-src)=["']([^"']+)["']/i
            );


        if (match) {

            return match[1];

        }

    }


    /* 6. content image */

    if (
        item.content
    ) {

        const match =
            item.content.match(
                /<img[^>]+(?:src|data-src)=["']([^"']+)["']/i
            );


        if (match) {

            return match[1];

        }

    }


    return "";

}


/* =====================================================
   DATE
===================================================== */

function formatDate(
    dateString
) {

    if (!dateString) {

        return "";

    }


    const date =
        new Date(
            dateString
        );


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return date.toLocaleString(
        "de-DE",
        {
            dateStyle:
                "short",

            timeStyle:
                "short"
        }
    );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
    item,
    sourceName
) {


    const title =
        escapeHTML(
            item.title ||
            "Без наслов"
        );


    const url =
        item.link ||
        "#";


    const image =
        getImage(
            item
        );


    const date =
        formatDate(
            item.pubDate
        );


    let imageHTML;


    if (image) {

        imageHTML = `

            <img
                class="card-image"
                src="${escapeHTML(image)}"
                alt="${title}"
                loading="lazy"
                onerror="
                    this.outerHTML=
                    '<div class=&quot;no-image&quot;>📰</div>'
                "
            >

        `;

    }

    else {

        imageHTML = `

            <div class="no-image">
                📰
            </div>

        `;

    }


    return `

        <article class="card">

            <a
                href="${escapeHTML(url)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                ${imageHTML}


                <div class="card-content">


                    <div class="card-title">

                        ${title}

                    </div>


                    <div class="card-source">

                        ${escapeHTML(
                            sourceName
                        )}

                    </div>


                    ${
                        date

                        ?

                        `
                        <div class="card-date">

                            ${date}

                        </div>
                        `

                        :

                        ""
                    }


                </div>

            </a>

        </article>

    `;

}


/* =====================================================
   LOAD RSS FEED
===================================================== */

async function loadFeed(
    feed
) {


    const response =
        await fetch(
            RSS_API +
            encodeURIComponent(
                feed.url
            )
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "RSS API error"
        );

    }


    const data =
        await response.json();


    if (
        data.status !== "ok"
    ) {

        throw new Error(
            data.message ||
            "RSS feed error"
        );

    }


    return data.items || [];

}


/* =====================================================
   LOAD SECTION
===================================================== */

async function loadSection(
    elementId,
    feedList
) {


    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML = `

        <div class="loading">

            Се вчитуваат вести...

        </div>

    `;


    let allItems = [];


    /* =========================
       LOAD ALL FEEDS
    ========================== */

    for (
        const feed of feedList
    ) {


        try {


            const items =
                await loadFeed(
                    feed
                );


            items.forEach(
                item => {


                    allItems.push({

                        ...item,

                        sourceName:
                            feed.name

                    });


                }
            );


        }


        catch (error) {


            console.error(

                feed.name,

                error

            );


        }

    }


    /* =========================
       SORT BY DATE
    ========================== */

    allItems.sort(

        (a, b) => {


            const dateA =
                new Date(
                    a.pubDate ||
                    0
                ).getTime();


            const dateB =
                new Date(
                    b.pubDate ||
                    0
                ).getTime();


            return dateB - dateA;

        }

    );


    /* =========================
       MAX 30 ARTICLES
    ========================== */

    allItems =
        allItems.slice(
            0,
            30
        );


    /* =========================
       DISPLAY
    ========================== */

    if (
        allItems.length === 0
    ) {


        container.innerHTML = `

            <div class="error">

                Нема достапни вести.

            </div>

        `;


        return;

    }


    container.innerHTML =

        allItems

            .map(

                item =>

                    createCard(

                        item,

                        item.sourceName

                    )

            )

            .join("");

}


/* =====================================================
   START
===================================================== */

loadSection(
    "mkd",
    feeds.mkd
);


loadSection(
    "de",
    feeds.de
);


loadSection(
    "starwars",
    feeds.starwars
);


</script>
