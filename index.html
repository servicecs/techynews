                #b8bcc2;

        /* =========================
           SECTION

        .section {

        }


        .section-title {

            display: flex;

            align-items: center;

            margin-bottom: 20px;

            padding-bottom: 9px;

                3px solid #222;

        .section-title h2 {

        /* =========================
           NEWS GRID
        ========================== */

        .news-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;
        }


        /* =========================
           NEWS CARD
        ========================== */

        .card {

            background: white;

            border:
                1px solid #ddd;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.06);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.13);
        }


        .card a {

            display: block;

            color: inherit;

            text-decoration: none;
        }


        /* =========================
           IMAGE
        ========================== */

        .image-wrapper {

            width: 100%;

            height: 190px;

            background:
                #e5e7eb;

            overflow: hidden;
        }


        .card-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.3s;
        }


        .card:hover .card-image {

            transform:
                scale(1.04);
        }


        .no-image {

            width: 100%;

            height: 190px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #e5e7eb,
                    #d1d5db
                );

            font-size: 42px;

            color: #6b7280;
        }


        /* =========================
           CONTENT
        ========================== */

        .card-content {

            padding: 15px;
        }


        .card-title {

            font-size: 17px;

            font-weight: bold;

            line-height: 1.4;

            margin-bottom: 9px;
        }


        .card-source {

            font-size: 13px;

            font-weight: bold;

            color: #6b7280;

            margin-bottom: 4px;
        }


        .card-date {

            font-size: 12px;

            color: #9ca3af;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 40px;

            color: #777;
        }


        /* =========================
           ERROR
        ========================== */

        .error {

                1 / -1;

            background: #fee2e2;

            color: #9ca3af;

            font-size: 13px;

<script>


/* =====================================================
   RSS FEEDS
===================================================== */

const feeds = {


    mkd: [

        {
            name: "SmartPortal",
            url:
                "https://smartportal.mk/feed/"
        },

        {
            name: "TIME.mk",
            url:
                "https://time.mk/rss/all"
        }

    ],


    de: [

        {
            name: "Centron",
            url:
                "https://www.centron.de/feed/"
        },

        {
            name: "Tarnkappe",
            url:
                "https://tarnkappe.info/feed"
        }

    ],


    starwars: [

        {
            name:
                "Star Wars News Net",

            url:
                "https://www.starwarsnewsnet.com/feed"
        },

        {
            name:
                "Star Wars Union",

            url:
                "https://starwars-union.de/feed/"
        },

        {
            name:
                "Jedi News",

            url:
                "https://www.jedinews.com/feed/"
        }

    ]

};


/* =====================================================
   RSS2JSON
===================================================== */

const RSS_API =
    "https://api.rss2json.com/v1/api.json?rss_url=";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    if (!text) {
        return "";
    }

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   EXTRACT FIRST IMAGE FROM HTML
===================================================== */

function extractImageFromHTML(
    html
) {

    if (!html) {
        return "";
    }


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    const img =
        doc.querySelector(
            "img"
        );


    if (!img) {
        return "";
    }


    return (
        img.getAttribute("src") ||
        img.getAttribute("data-src") ||
        img.getAttribute("data-lazy-src") ||
        ""
    );

}


/* =====================================================
   GET IMAGE
===================================================== */

function getImage(item) {


    /* thumbnail */

    if (
        typeof item.thumbnail === "string" &&
        item.thumbnail.trim()
    ) {

        return item.thumbnail.trim();

    }


    /* enclosure */

    if (
        item.enclosure
    ) {


        if (
            typeof item.enclosure === "object" &&
            item.enclosure.link
        ) {

            const type =
                item.enclosure.type ||
                "";


            if (
                !type ||
                type.startsWith("image/")
            ) {

                return item.enclosure.link;

            }

        }


        if (
            Array.isArray(
                item.enclosure
            )
        ) {


            for (
                const enclosure
                of item.enclosure
            ) {

                if (
                    enclosure &&
                    enclosure.link
                ) {

                    const type =
                        enclosure.type ||
                        "";


                    if (
                        !type ||
                        type.startsWith(
                            "image/"
                        )
                    ) {

                        return enclosure.link;

                    }

                }

            }

        }

    }


    /* media */

    if (
        item.media
    ) {


        const mediaValues = [

            item.media.content,

            item.media.thumbnail

        ];


        for (
            const value
            of mediaValues
        ) {


            if (
                Array.isArray(value)
            ) {


                for (
                    const media
                    of value
                ) {


                    if (
                        media &&
                        media.url
                    ) {

                        return media.url;

                    }

                }

            }


            if (
                value &&
                typeof value === "object" &&
                value.url
            ) {

                return value.url;

            }

        }

    }


    /* description */

    const descriptionImage =
        extractImageFromHTML(
            item.description
        );


    if (
        descriptionImage
    ) {

        return descriptionImage;

    }


    /* content */

    const contentImage =
        extractImageFromHTML(
            item.content
        );


    if (
        contentImage
    ) {

        return contentImage;

    }


    return "";

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        "de-DE",
        {
            dateStyle:
                "short",

            timeStyle:
                "short"
        }
    );

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
    item,
    sourceName
) {


    const title =
        escapeHTML(
            item.title ||
            "Без наслов"
        );


    const link =
        item.link ||
        "#";


    const image =
        getImage(
            item
        );


    const date =
        formatDate(
            item.pubDate
        );


    let imageHTML;


    if (image) {


        imageHTML = `

            <div class="image-wrapper">

                <img
                    class="card-image"
                    src="${escapeHTML(image)}"
                    alt="${title}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="
                        this.parentElement.innerHTML =
                        '<div class=&quot;no-image&quot;>📰</div>';
                    "
                >

            </div>

        `;

    }

    else {


        imageHTML = `

            <div class="no-image">
                📰
            </div>

        `;

    }


    return `

        <article class="card">

            <a
                href="${escapeHTML(link)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                ${imageHTML}


                <div class="card-content">


                    <div class="card-title">

                        ${title}

                    </div>


                    <div class="card-source">

                        ${escapeHTML(
                            sourceName
                        )}

                    </div>


                    ${
                        date

                        ?

                        `
                        <div class="card-date">
                            ${date}
                        </div>
                        `

                        :

                        ""
                    }


                </div>

            </a>

        </article>

    `;

}


/* =====================================================
   LOAD RSS
===================================================== */

async function loadFeed(
    feed
) {


    const url =
        RSS_API +
        encodeURIComponent(
            feed.url
        );


    const response =
        await fetch(
            url
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        data.status !== "ok"
    ) {

        throw new Error(
            data.message ||
            "RSS error"
        );

    }


    return data.items || [];

}


/* =====================================================
   LOAD SECTION
===================================================== */

async function loadSection(
    elementId,
    feedList
) {


    const container =
        document.getElementById(
            elementId
        );


    container.innerHTML = `

        <div class="loading">
            Се вчитуваат вести...
        </div>

    `;


    const results =
        await Promise.allSettled(

            feedList.map(
                feed =>
                    loadFeed(
                        feed
                    )
                    .then(
                        items => ({
                            feed,
                            items
                        })
                    )
            )

        );


    let allItems = [];


    for (
        const result
        of results
    ) {


        if (
            result.status !==
            "fulfilled"
        ) {

            console.error(
                result.reason
            );

            continue;

        }


        const {
            feed,
            items
        } =
            result.value;


        for (
            const item
            of items
        ) {


            allItems.push({

                ...item,

                sourceName:
                    feed.name

            });

        }

    }


    /* SORT NEWEST FIRST */

    allItems.sort(

        (a, b) => {

            const aDate =
                new Date(
                    a.pubDate || 0
                ).getTime();


            const bDate =
                new Date(
                    b.pubDate || 0
                ).getTime();


            return bDate - aDate;

        }

    );


    /* SHOW 30 */

    allItems =
        allItems.slice(
            0,
            30
        );


    /* EMPTY */

    if (
        allItems.length === 0
    ) {


        container.innerHTML = `

            <div class="error">

                Нема достапни вести.

            </div>

        `;


        return;

    }


    /* DISPLAY */

    container.innerHTML =

        allItems

            .map(
                item =>
                    createCard(
                        item,
                        item.sourceName
                    )
            )

            .join("");

}


/* =====================================================
   START
===================================================== */

loadSection(
    "mkd",
    feeds.mkd
);


loadSection(
    "de",
    feeds.de
);


loadSection(
    "starwars",
    feeds.starwars
);


</script>
