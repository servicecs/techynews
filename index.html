    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f2f3f5;

            color: #222;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            color: white;

            padding: 28px 20px;

            text-align: center;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.15);
        }


        header h1 {
            font-size: 32px;
            letter-spacing: 1px;
        }


        header p {
            margin-top: 6px;
            color: #cbd5e1;
        }


        /* =========================
           MAIN
        ========================== */

        main {
            width: 95%;
            max-width: 1400px;
            margin: 25px auto;
        }


        /* =========================
           BANNERS
        ========================== */

        .banners {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 40px;
        }


        .banner {

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 85px;

            padding: 15px;

            background: white;

            border:
                1px solid #ddd;

            border-radius: 12px;

            text-decoration: none;

            color: #111;

            font-weight: bold;

            transition: 0.2s;
        }


        .banner:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 7px 20px
                rgba(0,0,0,0.12);
        }


        /* =========================
           SECTIONS
        ========================== */

        .section {

            margin-bottom: 50px;
        }


        .section-title {

            display: flex;

            align-items: center;

            gap: 10px;

            border-bottom:
                3px solid #222;

            padding-bottom: 10px;

            margin-bottom: 20px;
        }


        .section-title h2 {

            font-size: 26px;
        }


        /* =========================
           NEWS GRID
        ========================== */

        .news-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;
        }


        /* =========================
           CARD
        ========================== */

        .card {

            background: white;

            border:
                1px solid #ddd;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.06);

            transition: 0.2s;
        }


        .card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.12);
        }


        .card a {

            display: block;

            text-decoration: none;

            color: inherit;
        }


        /* =========================
           IMAGE
        ========================== */

        .card-image {

            width: 100%;

            height: 190px;

            object-fit: cover;

            display: block;

            background: #e5e7eb;
        }


        .no-image {

            width: 100%;

            height: 190px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e5e7eb;

            font-size: 45px;
        }


        /* =========================
           CARD CONTENT
        ========================== */

        .card-content {

            padding: 15px;
        }


        .card-title {

            font-size: 17px;

            font-weight: bold;

            line-height: 1.4;

            margin-bottom: 10px;
        }


        .card-source {

            font-size: 13px;

            color: #6b7280;

            margin-bottom: 5px;
        }


        .card-date {

            font-size: 12px;

            color: #9ca3af;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            grid-column: 1 / -1;

            text-align: center;

            padding: 35px;

            color: #777;
        }


        /* =========================
           ERROR
        ========================== */

        .error {

            grid-column: 1 / -1;

            padding: 20px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 10px;

            text-align: center;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {

            margin-top: 40px;

            padding: 30px 20px;

            text-align: center;

            background: #111827;

            color: #9ca3af;

            font-size: 13px;
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 1000px) {

            .banners {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            header h1 {

                font-size: 25px;
            }


            .banners {

                grid-template-columns:
                    1fr;
            }


            .news-grid {

                grid-template-columns:
                    1fr;
            }


            .card-image,
            .no-image {

                height: 210px;
            }

        }

    </style>

</head>


<body>

========================= -->

<main>

        <a

    </div>



    <!-- =========================

            id="de"

            <div class="loading">

    <!-- =========================

<footer>

</footer>



<script>


    /* =====================================================
       RSS FEEDS
    ===================================================== */

    const feeds = {

        mkd: [

            {
                name: "SmartPortal",
                url: "https://smartportal.mk/feed/"
            },

            {
                name: "TIME.mk",
                url: "https://time.mk/rss/all"
            }

        ],


        de: [

            {
                name: "centron",
                url: "https://www.centron.de/feed/"
            },

            {
                name: "Tarnkappe",
                url: "https://tarnkappe.info/feed"
            }

        ],


        starwars: [

            {
                name: "Star Wars News Net",
                url: "https://www.starwarsnewsnet.com/feed"
            },

            {
                name: "Star Wars Union",
                url: "https://starwars-union.de/feed/"
            },

            {
                name: "Jedi News",
                url: "https://www.jedinews.com/feed/"
            }

        ]

    };



    /* =====================================================
       RSS2JSON
    ===================================================== */

    const RSS_API =
        "https://api.rss2json.com/v1/api.json?rss_url=";



    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(text) {

        if (!text) {
            return "";
        }

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }



    /* =====================================================
       EXTRACT IMAGE
    ===================================================== */

    function getImage(item) {

        if (
            item.thumbnail &&
            item.thumbnail.trim()
        ) {

            return item.thumbnail;
        }


        if (
            item.enclosure &&
            item.enclosure.link
        ) {

            return item.enclosure.link;
        }


        if (item.description) {

            const match =
                item.description.match(
                    /<img[^>]+src=["']([^"']+)["']/i
                );


            if (match) {

                return match[1];
            }

        }


        return "";
    }



    /* =====================================================
       FORMAT DATE
    ===================================================== */

    function formatDate(dateString) {

        if (!dateString) {

            return "";
        }


        const date =
            new Date(dateString);


        if (isNaN(date.getTime())) {

            return "";
        }


        return date.toLocaleString(
            "de-DE",
            {
                dateStyle: "short",
                timeStyle: "short"
            }
        );

    }



    /* =====================================================
       CREATE CARD
    ===================================================== */

    function createCard(item, sourceName) {

        const title =
            escapeHTML(
                item.title ||
                "Без наслов"
            );


        const url =
            item.link ||
            "#";


        const image =
            getImage(item);


        const date =
            formatDate(
                item.pubDate
            );


        let imageHTML;


        if (image) {

            imageHTML = `

                <img
                    class="card-image"
                    src="${escapeHTML(image)}"
                    alt="${title}"
                    loading="lazy"
                    onerror="this.outerHTML='<div class=&quot;no-image&quot;>📰</div>'"
                >

            `;

        }

        else {

            imageHTML = `

                <div class="no-image">
                    📰
                </div>

            `;

        }


        return `

            <article class="card">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    ${imageHTML}

                    <div class="card-content">

                        <div class="card-title">
                            ${title}
                        </div>

                        <div class="card-source">
                            ${escapeHTML(sourceName)}
                        </div>

                        ${
                            date
                            ?
                            `<div class="card-date">
                                ${date}
                            </div>`
                            :
                            ""
                        }

                    </div>

                </a>

            </article>

        `;

    }



    /* =====================================================
       LOAD ONE RSS FEED
    ===================================================== */

    async function loadFeed(feed) {

        const response =
            await fetch(
                RSS_API +
                encodeURIComponent(
                    feed.url
                )
            );


        if (!response.ok) {

            throw new Error(
                "RSS API error"
            );

        }


        const data =
            await response.json();


        if (
            data.status !== "ok"
        ) {

            throw new Error(
                data.message ||
                "RSS feed error"
            );

        }


        return data.items || [];

    }



    /* =====================================================
       LOAD SECTION
    ===================================================== */

    async function loadSection(
        elementId,
        feedList
    ) {

        const container =
            document.getElementById(
                elementId
            );


        container.innerHTML = `

            <div class="loading">
                Се вчитуваат вести...
            </div>

        `;


        let allItems = [];


        for (
            const feed of feedList
        ) {

            try {

                const items =
                    await loadFeed(
                        feed
                    );


                items.forEach(
                    item => {

                        allItems.push({

                            ...item,

                            sourceName:
                                feed.name

                        });

                    }
                );

            }

            catch (error) {

                console.error(
                    feed.name,
                    error
                );

            }

        }


        /* =========================
           SORT BY DATE
        ========================== */

        allItems.sort(
            (a, b) => {

                const dateA =
                    new Date(
                        a.pubDate || 0
                    ).getTime();


                const dateB =
                    new Date(
                        b.pubDate || 0
                    ).getTime();


                return dateB - dateA;

            }
        );


        /* =========================
           LIMIT
        ========================== */

        allItems =
            allItems.slice(
                0,
                30
            );


        /* =========================
           DISPLAY
        ========================== */

        if (
            allItems.length === 0
        ) {

            container.innerHTML = `

                <div class="error">

                    Нема достапни вести
                    од моменталните RSS извори.

                </div>

            `;

            return;

        }


        container.innerHTML =
            allItems
                .map(
                    item =>
                        createCard(
                            item,
                            item.sourceName
                        )
                )
                .join("");

    }



    /* =====================================================
       START
    ===================================================== */

    loadSection(
        "mkd",
        feeds.mkd
    );


    loadSection(
        "de",
        feeds.de
    );


    loadSection(
        "starwars",
        feeds.starwars
    );


</script>
